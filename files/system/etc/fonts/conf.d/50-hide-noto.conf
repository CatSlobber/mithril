<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <selectfont>
    <rejectfont>
      <pattern>
        <patelt name="family" qual="any">
          <string>Noto Sans</string>
          <string>Noto Serif</string>
          <string>Noto Mono</string>
        </patelt>
      </pattern>
    </rejectfont>
  </selectfont>
</fontconfig>
