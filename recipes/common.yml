modules:
  - type: files
    files:
      - source: system
        destination: /

  - type: akmods
    base: main
    install:
      - xone

  - type: dnf
    remove:
      packages:
        - firefox
        - firefox-langpacks
        - gnome-system-monitor
        - gnome-tour
        - gnome-software
        - gnome-software-rpm-ostree
        - gnome-classic-session
        - gnome-shell-extension-apps-menu
        - gnome-shell-extension-background-logo
        - gnome-shell-extension-launch-new-instance
        - gnome-shell-extension-places-menu
        - gnome-shell-extension-window-list
        - f44-backgrounds-gnome
        - fedora-workstation-backgrounds
        - gnome-backgrounds
        - malcontent-control
        - yelp
        - yelp-libs
        - yelp-xsl
        - htop
        - nvtop

  - type: fonts
    fonts:
      google-fonts:
        - DM Serif Display
        - Fraunces
        - IBM Plex Sans
        - Instrument Sans
        - JetBrains Mono
        - Lato
        - Newsreader
        - Oxygen
        - Roboto Mono
        - Rubik
        - SUSE

  - type: gnome-extensions
    install:
      - 9184 # Advanced Media Controller
      - 3628 # ArcMenu
      - 16 # Auto Move Windows
      - 3193 # Blur my Shell
      - 10070 # ChromaLeon
      - 3210 # Compiz window effect
      - 3843 # Just Perfection
      - 10448 # Simple Taskbar

  - type: default-flatpaks
    configurations:
      - notify: true
        scope: system
        install:
          - org.gnome.baobab
          - io.github.kolunmi.Bazaar
          - org.gnome.Boxes
          - org.gnome.Calculator
          - io.github.celluloid_player.Celluloid
          - org.gnome.Characters
          - org.onlyoffice.desktopeditors
          - com.mattjakeman.ExtensionManager
          - org.mozilla.firefox
          - com.github.tchx84.Flatseal
          - com.toolstack.Folio
          - org.gnome.font-viewer
          - org.fooyin.fooyin
          - org.gnome.Logs
          - org.gnome.Loupe
          - org.gnome.NautilusPreviewer
          - org.gnome.Papers
          - org.gnome.seahorse.Application
          - org.gnome.World.PikaBackup
          - io.github.CyberTimon.RapidRAW
          - page.tesk.Refine
          - net.nokyan.Resources
          - org.gnome.TextEditor
          - org.mozilla.thunderbird

  - type: script
    scripts:
      - install-appimage-thumbnailer.sh

  - type: gschema-overrides
    include:
      - zz1-common.gschema.override

  - type: signing
