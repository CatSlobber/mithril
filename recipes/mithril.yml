---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: mithril
description: A streamlined modification of Fedora Silverblue.
base-image: ghcr.io/ublue-os/silverblue-main
image-version: latest

platforms:
  - linux/amd64

modules:
  - from-file: common.yml

  - type: gschema-overrides
    include:
      - zz1-mithril.gschema.override

  - type: os-release
    properties:
      NAME: Mithril
      ID: mithril
      ID_LIKE: fedora
      VERSION_CODENAME: Silverblue
      PRETTY_NAME: Mithril
      FANCY_NAME: Mithril Linux
      ANSI_COLOR: 0;38;2;0;0;170
      LOGO: distro-fedora
      DEFAULT_HOSTNAME: mithril
      HOME_URL: https://github.com/catslobber/mithril
      DOCUMENTATION_URL: https://github.com/catslobber/mithril
      SUPPORT_URL: https://github.com/catslobber/mithril
      BUG_REPORT_URL: https://github.com/catslobber/mithril/issues/
      VARIANT: Silverblue
      VARIANT_ID: mithril

  - type: signing
