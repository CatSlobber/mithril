---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: mithril-gaming
description: A modification of Fedora Silverblue, streamlined for gaming and general use.
base-image: ghcr.io/ublue-os/silverblue-main
image-version: 45

platforms:
  - linux/amd64

modules:
  - from-file: common.yml

  - type: dnf
    repos:
      nonfree: negativo17
    install:
      packages:
        - steam
        
  - type: default-flatpaks
    configurations:
      - notify: true
        scope: system
        install:
          - com.heroicgameslauncher.hgl
          - org.musicbrainz.Picard
          - org.soundconverter.SoundConverter

  - type: gschema-overrides
    include:
      - zz1-mithril-gaming.gschema.override

  - type: os-release
    properties:
      NAME: Mithril Gaming
      ID: mithril
      ID_LIKE: fedora
      VERSION_CODENAME: Silverblue
      PRETTY_NAME: Mithril
      FANCY_NAME: Mithril Linux
      ANSI_COLOR: 0;38;2;138;43;226
      LOGO: distro-fedora
      DEFAULT_HOSTNAME: mithril
      HOME_URL: https://github.com/catslobber/mithril
      DOCUMENTATION_URL: https://github.com/catslobber/mithril
      SUPPORT_URL: https://github.com/catslobber/mithril
      BUG_REPORT_URL: https://github.com/catslobber/mithril/issues/
      VARIANT: Silverblue
      VARIANT_ID: mithril-gaming

  - type: signing
